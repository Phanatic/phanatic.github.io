---
layout: default
---
<article class="post">

  <header class="post-header">
    {% if page.prompt %}
      <div class="prompt"><span class="sep">:</span><span class="path">~</span><span class="sep">$</span> <span class="cmd">{{ page.prompt }}</span></div>
    {% endif %}
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.tagline %}<p class="post-meta">{{ page.tagline }}</p>{% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
