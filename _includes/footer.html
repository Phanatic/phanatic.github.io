<footer class="site-footer">
  <div class="wrapper bar">
    <div>
      <span class="prompt-mark">$</span> {{ site.title }} &mdash; {{ site.description }}
    </div>
    <nav class="foot-nav" aria-label="Footer">
      {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}">github</a>{% endif %}
      {% if site.twitter_username %}<a href="https://twitter.com/{{ site.twitter_username }}">twitter</a>{% endif %}
      {% if site.email %}<a href="mailto:{{ site.email }}">email</a>{% endif %}
      <a href="{{ "/feed.xml" | prepend: site.baseurl }}">rss</a>
    </nav>
  </div>
  <div class="wrapper" style="margin-top:10px;">
    <span class="comment">built with jekyll · &copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
  </div>
</footer>
