<header class="site-header">
  <div class="bar">
    <span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>

    <a class="brand" href="{{ site.url }}{{ site.baseurl }}/"><span class="sigil">~/</span>{{ site.github_username | default: "phani" }}</a>

    <nav class="site-nav" aria-label="Primary">
      <a class="page-link" href="{{ site.url }}{{ site.baseurl }}/">home</a>
      {% assign nav_order = "resume,writing,recommendations" | split: "," %}
      {% for slug in nav_order %}
        {% for p in site.pages %}
          {% if p.title and p.nav_slug == slug %}
            <span class="sep" aria-hidden="true">/</span>
            <a class="page-link" href="{{ p.url | prepend: site.baseurl }}">{{ p.title | downcase }}</a>
          {% endif %}
        {% endfor %}
      {% endfor %}

      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">◐</button>
    </nav>
  </div>
</header>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      var next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
